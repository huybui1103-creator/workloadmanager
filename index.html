<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My Tasks" />
  <meta name="theme-color" content="#0E0E0E" />
  <meta name="description" content="Personal workload manager" />
  <link rel="manifest" href="manifest.json" />
  <title>My Tasks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; }
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100%;
      background: #0E0E0E;
      color: #F0F0F0;
      padding-top: env(safe-area-inset-top, 0px);
      -webkit-font-smoothing: antialiased;
    }
    body.light { background: #F5F4F0; color: #111; }
    #app { max-width: 480px; margin: 0 auto; padding-bottom: 80px; width: 100%; }

    /* Header */
    .header { padding: 20px 20px 0; display: flex; justify-content: space-between; align-items: center; }
    .header-left .lbl { font-size: 9px; letter-spacing: 0.14em; color: #444; margin-bottom: 3px; }
    body.light .header-left .lbl { color: #AAA; }
    .header-left h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
    .header-right { display: flex; gap: 8px; align-items: center; }
    button { font-family: inherit; cursor: pointer; border: none; background: transparent; }
    .btn { border-radius: 6px; padding: 7px 13px; font-size: 12px; font-weight: 600; border: 1px solid #272727; color: #F0F0F0; background: transparent; }
    body.light .btn { border-color: #DDD; color: #111; }
    .btn-primary { background: #F0F0F0; color: #0E0E0E; border-color: #F0F0F0; }
    body.light .btn-primary { background: #111; color: #fff; border-color: #111; }
    .btn-icon { border: 1px solid #272727; border-radius: 6px; padding: 7px 10px; font-size: 15px; }
    body.light .btn-icon { border-color: #DDD; }
    .btn-csv { border: 1px solid #272727; border-radius: 6px; padding: 7px 10px; font-size: 11px; color: #888; }
    body.light .btn-csv { border-color: #DDD; color: #666; }

    /* Toggle */
    .toggle { width: 50px; height: 27px; border-radius: 14px; border: 1px solid #272727; background: #272727; display: flex; align-items: center; padding: 0 3px; }
    body.light .toggle { border-color: #E2E1DD; background: #E2E1DD; }
    .toggle-knob { width: 21px; height: 21px; border-radius: 50%; background: #F0F0F0; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: transform 0.25s; transform: translateX(23px); }
    body.light .toggle-knob { background: #111; transform: translateX(0); }

    /* Notif banner */
    #notif-banner { margin: 10px 16px; padding: 12px 14px; border-radius: 10px; background: #F57C0012; border: 1px solid #F57C0030; display: flex; gap: 10px; align-items: flex-start; }
    #notif-banner.hidden { display: none; }
    #notif-banner .ni { font-size: 18px; line-height: 1; }
    #notif-banner .nt { font-size: 12px; font-weight: 600; color: #F57C00; margin-bottom: 3px; }
    #notif-banner .nd { font-size: 11px; color: #888; line-height: 1.45; }
    body.light #notif-banner .nd { color: #666; }
    #notif-banner .na { display: flex; gap: 8px; margin-top: 10px; }
    .btn-non { background: #F57C00; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 11px; font-weight: 700; }
    .btn-nol { background: transparent; color: #888; border: 1px solid #272727; border-radius: 6px; padding: 6px 12px; font-size: 11px; }
    body.light .btn-nol { border-color: #DDD; }

    /* Capacity */
    #cap-bar { padding: 16px 20px; background: #161616; border-bottom: 1px solid #272727; margin-top: 12px; }
    body.light #cap-bar { background: #fff; border-color: #DDD; }
    .cap-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
    .cap-lbl { font-size: 9px; letter-spacing: 0.14em; color: #444; margin-bottom: 3px; }
    body.light .cap-lbl { color: #AAA; }
    .cap-used { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .cap-tot { font-size: 13px; color: #444; }
    body.light .cap-tot { color: #AAA; }
    .cap-al { font-size: 9px; letter-spacing: 0.14em; color: #444; margin-bottom: 3px; text-align: right; }
    body.light .cap-al { color: #AAA; }
    .cap-av { font-size: 22px; font-weight: 700; text-align: right; }
    .cap-track { height: 4px; background: #1E1E1E; border-radius: 2px; overflow: hidden; }
    body.light .cap-track { background: #E2E1DD; }
    .cap-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
    .cap-msg { margin-top: 7px; font-size: 11px; }

    /* Add form */
    #add-form { margin: 12px 16px; padding: 16px; background: #161616; border-radius: 10px; border: 1px solid #272727; display: none; }
    body.light #add-form { background: #fff; border-color: #DDD; }
    #add-form.show { display: block; }
    .form-lbl { font-size: 9px; letter-spacing: 0.12em; color: #444; margin-bottom: 12px; }
    body.light .form-lbl { color: #AAA; }
    .fi { width: 100%; background: #1A1A1A; border: 1px solid #272727; border-radius: 6px; padding: 9px 11px; color: #F0F0F0; font-size: 13px; font-family: inherit; outline: none; margin-bottom: 8px; }
    body.light .fi { background: #F0EFE9; border-color: #DDD; color: #111; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 8px; }
    .form-grid select, .form-grid input { width: 100%; background: #1A1A1A; border: 1px solid #272727; border-radius: 6px; padding: 9px 11px; color: #F0F0F0; font-size: 13px; font-family: inherit; outline: none; }
    body.light .form-grid select, body.light .form-grid input { background: #F0EFE9; border-color: #DDD; color: #111; }
    .btn-sub { width: 100%; background: #F0F0F0; color: #0E0E0E; border: none; border-radius: 6px; padding: 10px; font-size: 13px; font-weight: 700; }
    body.light .btn-sub { background: #111; color: #fff; }

    /* Tabs */
    .tabs { display: flex; gap: 0; padding: 14px 16px 0; border-bottom: 1px solid #272727; margin-top: 4px; overflow-x: auto; }
    body.light .tabs { border-color: #DDD; }
    .tab-btn { padding: 8px 11px; font-size: 12px; font-weight: 400; color: #444; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; white-space: nowrap; }
    body.light .tab-btn { color: #AAA; }
    .tab-btn.active { font-weight: 600; color: #F0F0F0; border-bottom-color: #F0F0F0; }
    body.light .tab-btn.active { color: #111; border-bottom-color: #111; }
    .tab-content { display: none; padding: 16px; width: 100%; box-sizing: border-box; }
    .tab-content.active { display: block; }

    /* Day selector */
    .day-row { display: flex; gap: 5px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; }
    .day-btn { min-width: 50px; padding: 10px 4px; flex: 1; background: #161616; border: 1px solid #272727; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: all 0.15s; }
    body.light .day-btn { background: #fff; border-color: #DDD; }
    .day-btn.active { background: #F0F0F0; border-color: #F0F0F0; }
    body.light .day-btn.active { background: #111; border-color: #111; }
    .day-btn.today:not(.active) { border-color: #888; }
    .day-name { font-size: 9px; letter-spacing: 0.08em; color: #444; }
    body.light .day-name { color: #AAA; }
    .day-btn.active .day-name { color: #0E0E0E; }
    body.light .day-btn.active .day-name { color: #fff; }
    .day-btn.today:not(.active) .day-name { color: #888; }
    .day-hours { font-size: 15px; font-weight: 700; }
    .day-dot { width: 4px; height: 4px; border-radius: 50%; background: #2E7D32; }

    /* Filter pills */
    .filter-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .filter-btn { border-radius: 20px; padding: 4px 13px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; border: 1px solid #1E1E1E; color: #444; background: transparent; }
    body.light .filter-btn { border-color: #E8E8E4; color: #AAA; }
    .filter-btn.active-all { background: #1C1C1C; border-color: #272727; color: #F0F0F0; }
    body.light .filter-btn.active-all { background: #EEEDE9; border-color: #DDD; color: #111; }
    .filter-btn.active-high { background: #E5393512; border-color: #E5393540; color: #E53935; }
    .filter-btn.active-med  { background: #F57C0012; border-color: #F57C0040; color: #F57C00; }
    .filter-btn.active-low  { background: #2E7D3212; border-color: #2E7D3240; color: #2E7D32; }
    .day-info { font-size: 9px; color: #444; letter-spacing: 0.1em; margin-bottom: 10px; }
    body.light .day-info { color: #AAA; }

    /* Task rows */
    .task-empty { text-align: center; padding: 48px; color: #444; font-size: 12px; }
    body.light .task-empty { color: #AAA; }
    .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; margin-bottom: 5px; background: #161616; border-radius: 10px; border: 1px solid #1E1E1E; transition: opacity 0.15s; width: 100%; box-sizing: border-box; }
    body.light .task-row { background: #fff; border-color: #E8E8E4; }
    .task-row.done { opacity: 0.45; }
    .task-row.overdue { border-color: #E5393530; }
    .check { width: 16px; height: 16px; min-width: 16px; min-height: 16px; margin-top: 2px; border: 2px solid #272727; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; flex-shrink: 0; box-sizing: content-box; }
    body.light .check { border-color: #DDD; }
    .check.checked { background: var(--pc); border-color: var(--pc); }
    .check.checked::after { content: '✓'; font-size: 9px; color: #fff; font-weight: 900; }
    .task-body { flex: 1; min-width: 0; overflow: hidden; }
    .task-title { font-size: 13px; font-weight: 500; margin-bottom: 5px; line-height: 1.35; }
    .task-row.done .task-title { text-decoration: line-through; color: #444; }
    body.light .task-row.done .task-title { color: #AAA; }
    .task-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .badge { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; padding: 2px 7px; border-radius: 3px; }
    .meta-tag { font-size: 10px; color: #888; }
    body.light .meta-tag { color: #666; }
    .meta-dim { font-size: 10px; color: #444; }
    body.light .meta-dim { color: #AAA; }
    .dl-tag { font-size: 10px; font-weight: 600; }
    .task-del { color: #444; font-size: 13px; padding: 2px 4px; flex-shrink: 0; }
    body.light .task-del { color: #AAA; }
    .btn-clear { width: 100%; margin-bottom: 10px; background: transparent; border: 1px solid #272727; border-radius: 8px; padding: 9px; font-size: 11px; color: #888; letter-spacing: 0.05em; }
    body.light .btn-clear { border-color: #DDD; color: #AAA; }

    /* Month calendar */
    .month-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .month-nav { font-size: 18px; padding: 4px 10px; color: #888; }
    .month-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; margin-bottom: 16px; }
    .cal-dname { font-size: 9px; color: #444; text-align: center; padding: 4px 0; letter-spacing: 0.06em; }
    body.light .cal-dname { color: #AAA; }
    .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; border: 1px solid transparent; position: relative; gap: 2px; }
    .cal-day:hover { border-color: #272727; }
    body.light .cal-day:hover { border-color: #DDD; }
    .cal-day.empty { cursor: default; }
    .cal-day.today { border-color: #888; }
    .cal-day.selected { background: #F0F0F0; }
    body.light .cal-day.selected { background: #111; }
    .cal-num { font-size: 13px; font-weight: 500; }
    .cal-day.selected .cal-num { color: #0E0E0E; }
    body.light .cal-day.selected .cal-num { color: #fff; }
    .cal-dots { display: flex; gap: 2px; justify-content: center; }
    .cal-dot { width: 4px; height: 4px; border-radius: 50%; }
    .cal-day-tasks { margin-top: 4px; }
    .cal-day-label { font-size: 9px; color: #444; letter-spacing: 0.1em; margin-bottom: 8px; }
    body.light .cal-day-label { color: #AAA; }
    body.light .month-nav { color: #666; }
    body.light .month-title { color: #111; }

    /* Backlog */
    .backlog-section { margin-bottom: 20px; }
    .backlog-header { font-size: 9px; letter-spacing: 0.1em; color: #444; margin-bottom: 10px; }
    body.light .backlog-header { color: #AAA; }
    .backlog-task { display: flex; align-items: center; gap: 10px; padding: 11px 14px; margin-bottom: 5px; background: #161616; border-radius: 10px; border: 1px solid #1E1E1E; width: 100%; box-sizing: border-box; }
    body.light .backlog-task { background: #fff; border-color: #E8E8E4; }
    .backlog-title { flex: 1; font-size: 13px; font-weight: 500; }
    .btn-assign { font-size: 11px; color: #F57C00; border: 1px solid #F57C0040; border-radius: 6px; padding: 4px 10px; background: #F57C0012; }

    /* AI */
    .ai-loading { text-align: center; padding: 64px 0; }
    .ai-loading .star { font-size: 26px; opacity: 0.3; margin-bottom: 14px; }
    .ai-loading .msg { font-size: 11px; letter-spacing: 0.1em; color: #444; }
    body.light .ai-loading .msg { color: #AAA; }
    .ai-card { padding: 18px; background: #161616; border-radius: 10px; border: 1px solid #272727; margin-bottom: 12px; }
    body.light .ai-card { background: #fff; border-color: #DDD; }
    .ai-sl { font-size: 9px; letter-spacing: 0.1em; margin-bottom: 10px; }
    .ai-tl { font-size: 9px; color: #F57C00; letter-spacing: 0.12em; margin-bottom: 8px; }
    .ai-tt { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 6px; }
    .ai-tr { font-size: 13px; color: #888; line-height: 1.55; }
    body.light .ai-tr { color: #666; }
    .ai-item { display: flex; gap: 12px; padding: 12px 14px; margin-bottom: 6px; background: #161616; border-radius: 10px; border: 1px solid #1E1E1E; }
    body.light .ai-item { background: #fff; border-color: #E8E8E4; }
    .ai-ir { font-size: 20px; font-weight: 700; color: #272727; min-width: 24px; line-height: 1; }
    body.light .ai-ir { color: #DDD; }
    .ai-iu { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; padding-top: 3px; flex-shrink: 0; }
    .ai-adv { margin-top: 8px; padding: 14px 16px; background: #161616; border-radius: 10px; border: 1px solid #1E1E1E; }
    body.light .ai-adv { background: #fff; border-color: #E8E8E4; }
    .ai-al { font-size: 9px; letter-spacing: 0.1em; margin-bottom: 6px; }
    .ai-at { font-size: 13px; color: #888; line-height: 1.55; }
    body.light .ai-at { color: #666; }
    .btn-air { margin-top: 14px; width: 100%; background: transparent; border: 1px solid #272727; border-radius: 6px; padding: 9px; font-size: 11px; color: #444; letter-spacing: 0.06em; }
    body.light .btn-air { border-color: #DDD; color: #AAA; }
    .ai-error { padding: 18px; background: #E5393510; border-radius: 10px; border: 1px solid #E5393530; color: #E53935; font-size: 13px; }

    /* Bottom bar */
    #bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #111; border-top: 1px solid #272727; padding: 10px 20px; padding-bottom: max(10px, env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; z-index: 100; }
    body.light #bottom-bar { background: #F5F4F0; border-color: #DDD; }
    .undo-grp { display: flex; gap: 8px; }
    .btn-ud { border: 1px solid #272727; border-radius: 8px; padding: 8px 16px; font-size: 13px; color: #888; transition: opacity 0.15s; }
    body.light .btn-ud { border-color: #DDD; }
    .btn-ud:disabled { opacity: 0.2; cursor: default; }
    .btn-ud:not(:disabled) { color: #F0F0F0; }
    body.light .btn-ud:not(:disabled) { color: #111; }
    .bar-hint { font-size: 10px; color: #444; letter-spacing: 0.05em; }
    body.light .bar-hint { color: #AAA; }

    /* Assign modal */
    #assign-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: flex-end; justify-content: center; }
    #assign-modal.show { display: flex; }
    .assign-sheet { background: #161616; border-radius: 16px 16px 0 0; padding: 20px; width: 100%; max-width: 480px; border-top: 1px solid #272727; }
    body.light .assign-sheet { background: #fff; border-color: #DDD; }
    .assign-title { font-size: 13px; font-weight: 600; margin-bottom: 14px; }
    .assign-task-name { font-size: 11px; color: #888; margin-bottom: 16px; }
    .assign-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .btn-assign-day { background: #1A1A1A; border: 1px solid #272727; border-radius: 8px; padding: 12px 8px; font-size: 12px; color: #888; text-align: center; }
    body.light .btn-assign-day { background: #F0EFE9; border-color: #DDD; color: #666; }
    .btn-assign-cancel { width: 100%; background: transparent; border: 1px solid #272727; border-radius: 8px; padding: 10px; font-size: 12px; color: #888; }
    body.light .btn-assign-cancel { border-color: #DDD; }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="lbl">WORKLOAD</div>
      <h1>My Tasks</h1>
    </div>
    <div class="header-right">
      <button class="btn-icon" id="btn-notif" onclick="handleNotif()">🔕</button>
      <button class="toggle" onclick="toggleDark()"><div class="toggle-knob" id="knob">☀</div></button>
      <button class="btn-csv" onclick="exportCSV()">↓ CSV</button>
      <button class="btn" id="btn-add" onclick="toggleForm()">+ Add</button>
    </div>
  </div>

  <!-- Notif banner -->
  <div id="notif-banner">
    <div class="ni">🔔</div>
    <div>
      <div class="nt">Bật thông báo để nhận nhắc nhở</div>
      <div class="nd">Nhận cảnh báo deadline &amp; workload tràn ngay trên điện thoại.</div>
      <div class="na">
        <button class="btn-non" onclick="handleNotif()">Bật ngay</button>
        <button class="btn-nol" onclick="dismissNotif()">Để sau</button>
      </div>
    </div>
  </div>

  <!-- Capacity -->
  <div id="cap-bar">
    <div class="cap-row">
      <div>
        <div class="cap-lbl">WEEKLY CAPACITY</div>
        <div style="display:flex;align-items:baseline;gap:5px">
          <span class="cap-used" id="cap-used">0h</span>
          <span class="cap-tot">/ 40h</span>
        </div>
      </div>
      <div>
        <div class="cap-al" id="cap-al">AVAILABLE</div>
        <div class="cap-av" id="cap-av">+40h</div>
      </div>
    </div>
    <div class="cap-track"><div class="cap-fill" id="cap-fill" style="width:0%"></div></div>
    <div class="cap-msg" id="cap-msg"></div>
  </div>

  <!-- Add form -->
  <div id="add-form">
    <div class="form-lbl">THÊM TASK MỚI</div>
    <input class="fi" id="f-title" placeholder="Tên task..." />
    <div class="form-grid">
      <select id="f-priority">
        <option value="high">🔴 High</option>
        <option value="med" selected>🟡 Medium</option>
        <option value="low">🟢 Low</option>
      </select>
      <input id="f-hours" type="number" placeholder="Số giờ" />
      <select id="f-category">
        <option>Design</option><option>Client</option><option>Strategy</option>
        <option>Admin</option><option>Order</option><option>Other</option>
      </select>
      <select id="f-day">
        <option value="-1">📦 Backlog</option>
        <option value="0">Monday</option><option value="1">Tuesday</option>
        <option value="2">Wednesday</option><option value="3">Thursday</option>
        <option value="4">Friday</option><option value="5">Saturday</option>
        <option value="6">Sunday</option>
      </select>
      <input id="f-deadline" type="date" style="grid-column:1/-1" />
    </div>
    <button class="btn-sub" onclick="addTask()">Thêm Task</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-week"    onclick="switchTab('week')">📅 Week</button>
    <button class="tab-btn"        id="tab-month"   onclick="switchTab('month')">🗓 Month</button>
    <button class="tab-btn"        id="tab-backlog" onclick="switchTab('backlog')">📦 Backlog</button>
    <button class="tab-btn"        id="tab-list"    onclick="switchTab('list')">☰ List</button>
    <button class="tab-btn"        id="tab-ai"      onclick="switchTab('ai')">✦ AI</button>
  </div>

  <!-- Week -->
  <div class="tab-content active" id="content-week">
    <div class="day-row" id="day-row"></div>
    <div class="day-info" id="day-info"></div>
    <div id="week-tasks"></div>
  </div>

  <!-- Month -->
  <div class="tab-content" id="content-month">
    <div class="month-header">
      <button class="month-nav" onclick="monthNav(-1)">‹</button>
      <div class="month-title" id="month-title"></div>
      <button class="month-nav" onclick="monthNav(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-day-label" id="cal-day-label"></div>
    <div id="cal-day-tasks"></div>
  </div>

  <!-- Backlog -->
  <div class="tab-content" id="content-backlog">
    <div id="backlog-content"></div>
  </div>

  <!-- List -->
  <div class="tab-content" id="content-list">
    <div id="clear-done-wrap"></div>
    <div class="filter-row" id="filter-row"></div>
    <div id="list-tasks"></div>
  </div>

  <!-- AI -->
  <div class="tab-content" id="content-ai">
    <div id="ai-content"></div>
  </div>

  <div style="height:16px"></div>
</div>

<!-- Bottom bar: Undo/Redo -->
<div id="bottom-bar">
  <div class="undo-grp">
    <button class="btn-ud" id="btn-undo" onclick="undo()" disabled>↩ Undo</button>
    <button class="btn-ud" id="btn-redo" onclick="redo()" disabled>↪ Redo</button>
  </div>
  <div class="bar-hint" id="bar-hint">–</div>
</div>

<!-- Assign modal -->
<div id="assign-modal">
  <div class="assign-sheet">
    <div class="assign-title">Assign vào ngày nào?</div>
    <div class="assign-task-name" id="assign-task-name"></div>
    <div class="assign-grid" id="assign-grid"></div>
    <button class="btn-assign-cancel" onclick="closeAssign()">Huỷ</button>
  </div>
</div>

<script>
var CAPACITY = 40;
var DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var FULL_DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var MONTHS = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
var PC = {
  high: { label:'HIGH', color:'#E53935', bg:'#E5393512' },
  med:  { label:'MED',  color:'#F57C00', bg:'#F57C0012' },
  low:  { label:'LOW',  color:'#2E7D32', bg:'#2E7D3212' }
};
var TODAY = new Date();
var TODAY_IDX = (function(){ var d = TODAY.getDay(); return d===0?6:d-1; })();

// State
var dark = true;
var tasks = [];
var filterDay = TODAY_IDX;
var filterPri = 'all';
var showForm = false;
var notifStatus = 'default';
var currentTab = 'week';
var calYear = TODAY.getFullYear();
var calMonth = TODAY.getMonth();
var calSelectedDay = null;
var assignTaskId = null;

// History
var history = [];
var historyIdx = -1;
var MAX_HIST = 20;

function pushHistory(label) {
  history = history.slice(0, historyIdx+1);
  history.push({ snap: JSON.stringify(tasks), label: label||'thao tác' });
  if (history.length > MAX_HIST) history.shift();
  historyIdx = history.length-1;
  updateUndoUI();
}
function undo() {
  if (historyIdx <= 0) return;
  historyIdx--;
  tasks = JSON.parse(history[historyIdx].snap);
  save(); renderAll(); updateUndoUI();
}
function redo() {
  if (historyIdx >= history.length-1) return;
  historyIdx++;
  tasks = JSON.parse(history[historyIdx].snap);
  save(); renderAll(); updateUndoUI();
}
function updateUndoUI() {
  var bu = document.getElementById('btn-undo');
  var br = document.getElementById('btn-redo');
  var bh = document.getElementById('bar-hint');
  if (bu) bu.disabled = historyIdx <= 0;
  if (br) br.disabled = historyIdx >= history.length-1;
  if (bh) {
    if (historyIdx > 0 && history[historyIdx]) {
      bh.textContent = history[historyIdx].label;
    } else {
      bh.textContent = '–';
    }
  }
}

// Init
(function init() {
  var sd = localStorage.getItem('wl-dark');
  dark = sd !== null ? sd==='true' : true;
  if (!dark) document.body.classList.add('light');
  updateToggle();
  try { tasks = JSON.parse(localStorage.getItem('wl-tasks')) || getSample(); } catch(e) { tasks = getSample(); }
  if (!('Notification' in window)) { notifStatus = 'unsupported'; }
  else if (localStorage.getItem('wl-notif-dismissed')) { notifStatus = 'dismissed'; }
  else { notifStatus = Notification.permission; }
  updateNotifUI();
  history = [{ snap: JSON.stringify(tasks), label: 'trạng thái ban đầu' }];
  historyIdx = 0;
  renderAll();
  updateUndoUI();
})();

function getSample() {
  return [
    { id:1, title:'Design jersey artwork - Team Alpha', priority:'high', hours:8, category:'Design', deadline:'2026-04-01', done:false, day:0 },
    { id:2, title:'Sticker pack illustration x5',       priority:'high', hours:6, category:'Design', deadline:'2026-04-03', done:false, day:1 },
    { id:3, title:'Brand guidelines document',          priority:'med',  hours:4, category:'Strategy',deadline:'2026-04-07', done:false, day:2 },
    { id:4, title:'Client feedback - Hoodie mockup',    priority:'med',  hours:2, category:'Client',  deadline:'2026-04-04', done:false, day:1 },
    { id:5, title:'Vectorize logo assets',              priority:'low',  hours:3, category:'Design',  deadline:'2026-04-10', done:false, day:4 },
    { id:6, title:'Research new merch suppliers',       priority:'low',  hours:2, category:'Strategy',deadline:'', done:false, day:-1 },
    { id:7, title:'Update price list Q2',               priority:'med',  hours:1, category:'Admin',   deadline:'', done:false, day:-1 }
  ];
}

function save() { localStorage.setItem('wl-tasks', JSON.stringify(tasks)); }

function toggleDark() {
  dark = !dark;
  document.body.classList.toggle('light', !dark);
  localStorage.setItem('wl-dark', String(dark));
  updateToggle(); renderAll();
}
function updateToggle() {
  var k = document.getElementById('knob');
  if (k) k.textContent = dark ? '☀' : '☾';
}

// Notif
function updateNotifUI() {
  var banner = document.getElementById('notif-banner');
  var btn = document.getElementById('btn-notif');
  if (notifStatus==='granted') { if(banner)banner.classList.add('hidden'); if(btn)btn.textContent='🔔'; }
  else if (notifStatus==='unsupported'||notifStatus==='dismissed') { if(banner)banner.classList.add('hidden'); }
  else { if(banner)banner.classList.remove('hidden'); if(btn)btn.textContent='🔕'; }
}
function handleNotif() {
  if (!('Notification' in window)) return;
  Notification.requestPermission().then(function(r) {
    notifStatus = r; updateNotifUI();
    if (r==='granted') { sendNotif('Thong bao da bat!','Ban se nhan canh bao tu gio.'); checkNotifs(); }
  });
}
function dismissNotif() { localStorage.setItem('wl-notif-dismissed','1'); notifStatus='dismissed'; updateNotifUI(); }
function sendNotif(t,b) { if(!('Notification'in window)||Notification.permission!=='granted')return; try{new Notification(t,{body:b,icon:'/icon-192.png'});}catch(e){} }
function checkNotifs() {
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  var today=new Date(); today.setHours(0,0,0,0);
  var used=tasks.filter(function(t){return!t.done&&t.day>=0;}).reduce(function(s,t){return s+t.hours;},0);
  var pct=(used/CAPACITY)*100, todayStr=new Date().toDateString();
  tasks.filter(function(t){return!t.done&&t.deadline;}).forEach(function(t){
    var diff=Math.round((new Date(t.deadline)-today)/86400000);
    var key='wl-n-'+t.id+'-'+diff;
    if(localStorage.getItem(key))return;
    if(diff<0){sendNotif('Task qua han!',t.title+' qua '+Math.abs(diff)+' ngay.');localStorage.setItem(key,'1');}
    else if(diff===0){sendNotif('Deadline hom nay!',t.title);localStorage.setItem(key,'1');}
    else if(diff===1){sendNotif('Deadline ngay mai',t.title);localStorage.setItem(key,'1');}
    else if(diff===3){sendNotif('Con 3 ngay',t.title);localStorage.setItem(key,'1');}
  });
  if(pct>=100&&localStorage.getItem('wl-cap-100')!==todayStr){sendNotif('Workload tran!','Da vuot '+used+'h/40h.');localStorage.setItem('wl-cap-100',todayStr);}
  else if(pct>=80&&pct<100&&localStorage.getItem('wl-cap-80')!==todayStr){sendNotif('Workload gan day','Da dung '+used+'h/40h.');localStorage.setItem('wl-cap-80',todayStr);}
}

// Capacity
function renderCap() {
  var used=tasks.filter(function(t){return!t.done&&t.day>=0;}).reduce(function(s,t){return s+t.hours;},0);
  var pct=Math.min((used/CAPACITY)*100,100);
  var col=pct>85?'#E53935':pct>60?'#F57C00':'#2E7D32';
  var free=CAPACITY-used;
  document.getElementById('cap-used').textContent=used+'h';
  document.getElementById('cap-al').textContent=free>0?'AVAILABLE':'OVERLOADED';
  document.getElementById('cap-av').textContent=free>0?'+'+free+'h':Math.abs(free)+'h over';
  document.getElementById('cap-av').style.color=col;
  document.getElementById('cap-fill').style.width=pct+'%';
  document.getElementById('cap-fill').style.background=col;
  document.getElementById('cap-msg').style.color=col;
  document.getElementById('cap-msg').textContent=pct<60?'✓ Ban co the nhan them task':pct<85?'⚡ Dang ban — can nhac truoc khi nhan':'🔴 Da day — hoan thanh truoc khi nhan them';
}

// Form
function toggleForm() {
  showForm=!showForm;
  document.getElementById('add-form').className=showForm?'show':'';
  document.getElementById('btn-add').textContent=showForm?'✕':'+ Add';
  document.getElementById('btn-add').className=showForm?'btn btn-primary':'btn';
}
function addTask() {
  var title=document.getElementById('f-title').value.trim();
  var hours=parseFloat(document.getElementById('f-hours').value);
  if(!title||!hours)return;
  pushHistory('Thêm: '+title);
  tasks.push({ id:Date.now(), title:title, priority:document.getElementById('f-priority').value,
    hours:hours, category:document.getElementById('f-category').value,
    deadline:document.getElementById('f-deadline').value,
    day:parseInt(document.getElementById('f-day').value), done:false });
  save();
  document.getElementById('f-title').value='';
  document.getElementById('f-hours').value='';
  document.getElementById('f-deadline').value='';
  document.getElementById('f-priority').value='med';
  document.getElementById('f-day').value='-1';
  toggleForm(); checkNotifs(); renderAll();
}

// Tab
function switchTab(tab) {
  currentTab=tab;
  ['week','month','backlog','list','ai'].forEach(function(t){
    document.getElementById('tab-'+t).className='tab-btn'+(t===tab?' active':'');
    document.getElementById('content-'+t).className='tab-content'+(t===tab?' active':'');
  });
  if(tab==='month') renderMonth();
  if(tab==='backlog') renderBacklog();
  if(tab==='ai') runAI();
}

// Deadline label
function dlLabel(task) {
  if(!task.deadline||task.done)return null;
  var today=new Date(); today.setHours(0,0,0,0);
  var diff=Math.round((new Date(task.deadline)-today)/86400000);
  if(diff<0)  return{text:'Qua han '+Math.abs(diff)+'ng',color:'#E53935'};
  if(diff===0)return{text:'Hom nay!',color:'#E53935'};
  if(diff===1)return{text:'Ngay mai',color:'#F57C00'};
  if(diff<=3) return{text:'Con '+diff+' ngay',color:'#F57C00'};
  return{text:'📅 '+task.deadline,color:dark?'#444':'#AAA'};
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function taskHTML(task) {
  var pc=PC[task.priority], dl=dlLabel(task), isOver=dl&&dl.color==='#E53935';
  var dlH=dl?'<span class="dl-tag" style="color:'+dl.color+'">'+dl.text+'</span>':'';
  return '<div class="task-row'+(task.done?' done':'')+(isOver?' overdue':'')+'" id="tr-'+task.id+'">'+
    '<div class="check'+(task.done?' checked':'')+'" style="--pc:'+pc.color+'" onclick="toggleDone('+task.id+')"></div>'+
    '<div class="task-body">'+
      '<div class="task-title">'+escHtml(task.title)+'</div>'+
      '<div class="task-meta">'+
        '<span class="badge" style="color:'+pc.color+';background:'+pc.bg+';border:1px solid '+pc.color+'25">'+pc.label+'</span>'+
        '<span class="meta-tag">'+escHtml(task.category)+'</span>'+
        '<span class="meta-dim">⏱ '+task.hours+'h</span>'+
        (task.day>=0?'<span class="meta-dim">'+DAYS[task.day]+'</span>':'')+
        dlH+
      '</div>'+
    '</div>'+
    '<button class="task-del" onclick="deleteTask('+task.id+')">✕</button>'+
  '</div>';
}

function toggleDone(id) {
  var t=tasks.filter(function(x){return x.id===id;})[0];
  pushHistory((t&&t.done?'Bỏ done: ':'Done: ')+(t?t.title:''));
  tasks=tasks.map(function(x){return x.id===id?Object.assign({},x,{done:!x.done}):x;});
  save(); renderAll();
}
function deleteTask(id) {
  var t=tasks.filter(function(x){return x.id===id;})[0];
  pushHistory('Xóa: '+(t?t.title:''));
  tasks=tasks.filter(function(x){return x.id!==id;});
  save(); renderAll();
}
function clearDone() {
  var count=tasks.filter(function(t){return t.done;}).length;
  if(!count)return;
  if(!confirm('Xóa '+count+' task đã done?'))return;
  pushHistory('Xóa '+count+' task done');
  tasks=tasks.filter(function(t){return!t.done;});
  save(); renderAll();
}

function sortFn(a,b) {
  var ord={high:0,med:1,low:2};
  if(a.done!==b.done)return a.done?1:-1;
  return ord[a.priority]-ord[b.priority];
}

// Week view
function renderWeek() {
  var dayHours=DAYS.map(function(_,i){return tasks.filter(function(t){return t.day===i&&!t.done;}).reduce(function(s,t){return s+t.hours;},0);});
  var html='';
  DAYS.forEach(function(d,i){
    var h=dayHours[i],active=i===filterDay,isToday=i===TODAY_IDX;
    var cls='day-btn'+(active?' active':'')+(isToday&&!active?' today':'');
    var nc=active?(dark?'#0E0E0E':'#fff'):isToday?'#888':(dark?'#444':'#AAA');
    var hc=active?(dark?'#0E0E0E':'#fff'):h>8?'#E53935':(dark?'#F0F0F0':'#111');
    html+='<button class="'+cls+'" onclick="selectDay('+i+')">'+
      '<span class="day-name" style="color:'+nc+'">'+d+'</span>'+
      '<span class="day-hours" style="color:'+hc+'">'+h+'h</span>'+
      (isToday&&!active?'<div class="day-dot"></div>':'')+
    '</button>';
  });
  document.getElementById('day-row').innerHTML=html;
  var dt=tasks.filter(function(t){return t.day===filterDay;}).sort(sortFn);
  document.getElementById('day-info').textContent=FULL_DAYS[filterDay].toUpperCase()+' — '+dt.filter(function(t){return!t.done;}).length+' tasks · '+dayHours[filterDay]+'h';
  document.getElementById('week-tasks').innerHTML=dt.length===0?'<div class="task-empty">Chua co task nao</div>':dt.map(taskHTML).join('');
}
function selectDay(i){filterDay=i;renderWeek();}

// Month view
function renderMonth() {
  var title=MONTHS[calMonth]+' '+calYear;
  document.getElementById('month-title').textContent=title;
  var firstDay=new Date(calYear,calMonth,1).getDay();
  firstDay=(firstDay===0?6:firstDay-1);
  var daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  var html='';
  ['T2','T3','T4','T5','T6','T7','CN'].forEach(function(d){html+='<div class="cal-dname">'+d+'</div>';});
  for(var i=0;i<firstDay;i++) html+='<div class="cal-day empty"></div>';
  for(var d=1;d<=daysInMonth;d++){
    var dateStr=calYear+'-'+pad2(calMonth+1)+'-'+pad2(d);
    var dayTasks=tasks.filter(function(t){return t.deadline===dateStr&&!t.done;});
    var isToday=(d===TODAY.getDate()&&calMonth===TODAY.getMonth()&&calYear===TODAY.getFullYear());
    var isSel=calSelectedDay===d;
    var cls='cal-day'+(isToday?' today':'')+(isSel?' selected':'');
    var numColor=isSel?(dark?'#0E0E0E':'#fff'):(dark?'#F0F0F0':'#111');
    var dots='';
    if(dayTasks.length>0){
      var colors=[];
      dayTasks.slice(0,3).forEach(function(t){colors.push(PC[t.priority].color);});
      dots='<div class="cal-dots">'+colors.map(function(c){return'<div class="cal-dot" style="background:'+c+'"></div>';}).join('')+'</div>';
    }
    html+='<div class="'+cls+'" onclick="selectCalDay('+d+')"><span class="cal-num" style="color:'+numColor+'">'+d+'</span>'+dots+'</div>';
  }
  document.getElementById('cal-grid').innerHTML=html;
  if(calSelectedDay){
    var selDate=calYear+'-'+pad2(calMonth+1)+'-'+pad2(calSelectedDay);
    var selTasks=tasks.filter(function(t){return t.deadline===selDate;});
    document.getElementById('cal-day-label').textContent=calSelectedDay+'/'+pad2(calMonth+1)+'/'+calYear+' — '+selTasks.length+' task có deadline';
    document.getElementById('cal-day-tasks').innerHTML=selTasks.length===0?'<div class="task-empty" style="padding:20px">Không có task deadline ngày này</div>':selTasks.map(taskHTML).join('');
  } else {
    document.getElementById('cal-day-label').textContent='Tap vào ngày để xem task';
    document.getElementById('cal-day-tasks').innerHTML='';
  }
}
function selectCalDay(d){calSelectedDay=d;renderMonth();}
function monthNav(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  calSelectedDay=null;
  renderMonth();
}
function pad2(n){return n<10?'0'+n:String(n);}

// Backlog view
function renderBacklog() {
  var backlog=tasks.filter(function(t){return t.day===-1&&!t.done;}).sort(sortFn);
  var done=tasks.filter(function(t){return t.day===-1&&t.done;});
  var html='';
  if(backlog.length===0&&done.length===0){
    html='<div class="task-empty">Backlog trống — thêm task chưa assign vào đây</div>';
  } else {
    if(backlog.length>0){
      html+='<div class="backlog-header">CHƯA ASSIGN ('+backlog.length+')</div>';
      backlog.forEach(function(t){
        var pc=PC[t.priority];
        html+='<div class="backlog-task" id="tr-'+t.id+'">'+
          '<div style="flex:1">'+
            '<div class="backlog-title">'+escHtml(t.title)+'</div>'+
            '<div class="task-meta" style="margin-top:4px">'+
              '<span class="badge" style="color:'+pc.color+';background:'+pc.bg+';border:1px solid '+pc.color+'25">'+pc.label+'</span>'+
              '<span class="meta-dim">⏱ '+t.hours+'h</span>'+
              (t.deadline?'<span class="dl-tag" style="color:#F57C00">📅 '+t.deadline+'</span>':'')+
            '</div>'+
          '</div>'+
          '<button class="btn-assign" onclick="openAssign('+t.id+')">Assign →</button>'+
          '<button class="task-del" onclick="deleteTask('+t.id+')" style="margin-left:6px">✕</button>'+
        '</div>';
      });
    }
    if(done.length>0){
      html+='<div class="backlog-header" style="margin-top:16px">DONE ('+done.length+')</div>';
      done.forEach(function(t){ html+=taskHTML(t); });
    }
  }
  document.getElementById('backlog-content').innerHTML=html;
}

// Assign modal
function openAssign(id) {
  assignTaskId=id;
  var t=tasks.filter(function(x){return x.id===id;})[0];
  if(!t)return;
  document.getElementById('assign-task-name').textContent=t.title;
  var grid='';
  FULL_DAYS.forEach(function(d,i){
    grid+='<button class="btn-assign-day" onclick="assignToDay('+i+')">'+d+'</button>';
  });
  document.getElementById('assign-grid').innerHTML=grid;
  document.getElementById('assign-modal').className='show';
}
function assignToDay(dayIdx) {
  if(assignTaskId===null)return;
  var t=tasks.filter(function(x){return x.id===assignTaskId;})[0];
  pushHistory('Assign: '+(t?t.title:'')+' → '+FULL_DAYS[dayIdx]);
  tasks=tasks.map(function(x){return x.id===assignTaskId?Object.assign({},x,{day:dayIdx}):x;});
  save(); renderAll(); closeAssign();
  switchTab('week'); filterDay=dayIdx; renderWeek();
}
function closeAssign() {
  assignTaskId=null;
  document.getElementById('assign-modal').className='';
}

// List view
function renderList() {
  var doneCount=tasks.filter(function(t){return t.done;}).length;
  var wrap=document.getElementById('clear-done-wrap');
  if(wrap) wrap.innerHTML=doneCount>0?'<button class="btn-clear" onclick="clearDone()">🗑 Xóa '+doneCount+' task đã done</button>':'';
  var filters=[{key:'all',label:'ALL'},{key:'high',label:'HIGH'},{key:'med',label:'MED'},{key:'low',label:'LOW'}];
  document.getElementById('filter-row').innerHTML=filters.map(function(f){
    var count=f.key==='all'?tasks.filter(function(t){return!t.done;}).length:tasks.filter(function(t){return t.priority===f.key&&!t.done;}).length;
    var cls='filter-btn'+(filterPri===f.key?(f.key==='all'?' active-all':' active-'+f.key):'');
    return'<button class="'+cls+'" onclick="setFilter(\''+f.key+'\')">'+f.label+' <span style="opacity:0.5">'+count+'</span></button>';
  }).join('');
  var sorted=tasks.slice().filter(function(t){return filterPri==='all'||t.priority===filterPri;}).sort(sortFn);
  document.getElementById('list-tasks').innerHTML=sorted.length===0?'<div class="task-empty">Khong co task</div>':sorted.map(taskHTML).join('');
}
function setFilter(p){filterPri=p;renderList();}

// Render all
function renderAll() { renderCap(); renderWeek(); renderList(); renderBacklog(); if(currentTab==='month')renderMonth(); }

// Export
function exportCSV() {
  var rows=[['Title','Priority','Hours','Category','Deadline','Day','Done']];
  tasks.forEach(function(t){rows.push(['"'+t.title+'"',t.priority,t.hours,t.category,t.deadline||'',t.day>=0?FULL_DAYS[t.day]:'Backlog',t.done?'Yes':'No']);});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.map(function(r){return r.join(',');}).join('\n')],{type:'text/csv'}));
  a.download='workload.csv'; a.click();
}

// AI
function saveApiKey() {
  var input=document.getElementById('api-key-input');
  if(!input||!input.value.trim())return;
  localStorage.setItem('wl-apikey',input.value.trim()); runAI();
}
function runAI() {
  var el=document.getElementById('ai-content');
  var apiKey=localStorage.getItem('wl-apikey')||'';
  if(!apiKey){
    var tc=dark?'#888':'#666',ib=dark?'#1A1A1A':'#F0EFE9',ic=dark?'#F0F0F0':'#111',bc=dark?'#272727':'#DDD';
    el.innerHTML='<div class="ai-card"><div class="ai-tl">✦ CÀI ĐẶT AI</div>'+
      '<div style="font-size:13px;color:'+tc+';line-height:1.6;margin-bottom:14px">Cần Anthropic API key.<br><br>'+
      '1. Vào <a href="https://console.anthropic.com" target="_blank" style="color:#F57C00">console.anthropic.com</a><br>'+
      '2. Đăng ký miễn phí → API Keys → Tạo key mới</div>'+
      '<input id="api-key-input" type="password" placeholder="sk-ant-api03-..." style="width:100%;background:'+ib+';border:1px solid '+bc+';border-radius:6px;padding:10px 12px;color:'+ic+';font-size:13px;font-family:inherit;outline:none;margin-bottom:10px"/>'+
      '<button onclick="saveApiKey()" style="width:100%;background:#F57C00;color:#fff;border:none;border-radius:6px;padding:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">Lưu & Phân tích</button>'+
      '<div style="font-size:10px;color:'+tc+';margin-top:10px">🔒 Key lưu trên thiết bị của bạn.</div></div>';
    return;
  }
  el.innerHTML='<div class="ai-loading"><div class="star">✦</div><div class="msg">DANG PHAN TICH TASK...</div></div>';
  var active=tasks.filter(function(t){return!t.done&&t.day>=0;});
  var used=active.reduce(function(s,t){return s+t.hours;},0);
  var prompt='Ban la productivity coach. Phan tich cac task sau va dua ra thu tu uu tien.\n'+
    'Tasks: '+JSON.stringify(active.map(function(t){return{title:t.title,priority:t.priority,hours:t.hours,category:t.category,deadline:t.deadline||'khong co',day:FULL_DAYS[t.day]};}))+'\n'+
    'Capacity: '+used+'/40h. Hom nay: '+FULL_DAYS[TODAY_IDX]+'.\n'+
    'CHI JSON: {"topTask":"...","topReason":"...","orderedList":[{"rank":1,"title":"...","reason":"...","urgency":"high|med|low"}],"capacityAdvice":"...","focusTip":"..."}';
  fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})})
  .then(function(r){return r.json();})
  .then(function(data){
    var ai=JSON.parse(data.content.map(function(b){return b.text||'';}).join('').replace(/```json|```/g,'').trim());
    var h='<div class="ai-card"><div class="ai-tl">✦ LAM TRUOC TIEN</div><div class="ai-tt">'+escHtml(ai.topTask)+'</div><div class="ai-tr">'+escHtml(ai.topReason)+'</div></div>';
    h+='<div class="ai-sl" style="color:'+(dark?'#444':'#AAA')+'">THU TU UU TIEN</div>';
    ai.orderedList.forEach(function(item){
      var col=item.urgency==='high'?'#E53935':item.urgency==='med'?'#F57C00':'#2E7D32';
      h+='<div class="ai-item"><div class="ai-ir">'+item.rank+'</div><div style="flex:1"><div style="font-size:13px;font-weight:500;margin-bottom:4px">'+escHtml(item.title)+'</div><div style="font-size:11px;color:'+(dark?'#888':'#666')+';line-height:1.45">'+escHtml(item.reason)+'</div></div><div class="ai-iu" style="color:'+col+'">'+item.urgency.toUpperCase()+'</div></div>';
    });
    [{label:'CAPACITY',value:ai.capacityAdvice,color:'#2E7D32'},{label:'TIP HOM NAY',value:ai.focusTip,color:'#F57C00'}].forEach(function(a){
      h+='<div class="ai-adv"><div class="ai-al" style="color:'+a.color+'">'+a.label+'</div><div class="ai-at">'+escHtml(a.value)+'</div></div>';
    });
    h+='<button class="btn-air" onclick="runAI()">↻ Phan tich lai</button>';
    el.innerHTML=h;
  }).catch(function(){el.innerHTML='<div class="ai-error">Loi ket noi AI.</div><button class="btn-air" onclick="runAI()" style="margin-top:12px">↻ Thu lai</button>';});
}

if('serviceWorker'in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}
setTimeout(checkNotifs,2000);
</script>
