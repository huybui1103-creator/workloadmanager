#app { max-width: 480px; margin: 0 auto; min-height: 100vh; }

<script>
var CAPACITY = 40;
var DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var FULL_DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var PC = {
  high: { label:'HIGH', color:'#E53935', bg:'#E5393512' },
  med:  { label:'MED',  color:'#F57C00', bg:'#F57C0012' },
  low:  { label:'LOW',  color:'#2E7D32', bg:'#2E7D3212' }
};
var TODAY_IDX = (function(){ var d = new Date().getDay(); return d === 0 ? 6 : d - 1; })();

// State
var dark = true;
var tasks = [];
var filterDay = TODAY_IDX;
var filterPri = 'all';
var showForm = false;
var notifStatus = 'default';
var currentTab = 'week';

// Undo/Redo history
var history = [];
var historyIdx = -1;
var MAX_HISTORY = 20;

function pushHistory() {
  // Remove any redo states
  history = history.slice(0, historyIdx + 1);
  history.push(JSON.stringify(tasks));
  if (history.length > MAX_HISTORY) history.shift();
  historyIdx = history.length - 1;
  updateUndoUI();
}

function undo() {
  if (historyIdx <= 0) return;
  historyIdx--;
  tasks = JSON.parse(history[historyIdx]);
  save(); renderAll(); updateUndoUI();
}

function redo() {
  if (historyIdx >= history.length - 1) return;
  historyIdx++;
  tasks = JSON.parse(history[historyIdx]);
  save(); renderAll(); updateUndoUI();
}

function updateUndoUI() {
  var btnUndo = document.getElementById('btn-undo');
  var btnRedo = document.getElementById('btn-redo');
  if (btnUndo) btnUndo.disabled = historyIdx <= 0;
  if (btnRedo) btnRedo.disabled = historyIdx >= history.length - 1;
}

function clearDone() {
  var count = tasks.filter(function(t){ return t.done; }).length;
  if (count === 0) return;
  if (!confirm('Xóa ' + count + ' task đã done?')) return;
  pushHistory();
  tasks = tasks.filter(function(t){ return !t.done; });
  save(); renderAll();
}

// Init
(function init() {
  var sd = localStorage.getItem('wl-dark');
  dark = sd !== null ? sd === 'true' : true;
  if (!dark) document.body.classList.add('light');
  updateToggle();

  try { tasks = JSON.parse(localStorage.getItem('wl-tasks')) || getSample(); }
  catch(e) { tasks = getSample(); }

  if (!('Notification' in window)) {
    notifStatus = 'unsupported';
  } else if (localStorage.getItem('wl-notif-dismissed')) {
    notifStatus = 'dismissed';
  } else {
    notifStatus = Notification.permission;
  }
  updateNotifUI();
  // Init history with current state
  history = [JSON.stringify(tasks)];
  historyIdx = 0;
  renderAll();
  updateUndoUI();
})();

function getSample() {
  return [
    { id:1, title:'Design jersey artwork - Team Alpha', priority:'high', hours:8, category:'Design', deadline:'2026-04-01', done:false, day:0 },
    { id:2, title:'Sticker pack illustration x5',       priority:'high', hours:6, category:'Design', deadline:'2026-04-03', done:false, day:1 },
    { id:3, title:'Brand guidelines document',          priority:'med',  hours:4, category:'Strategy',deadline:'2026-04-07', done:false, day:2 },
    { id:4, title:'Client feedback - Hoodie mockup',    priority:'med',  hours:2, category:'Client',  deadline:'2026-04-04', done:false, day:1 },
    { id:5, title:'Vectorize logo assets',              priority:'low',  hours:3, category:'Design',  deadline:'2026-04-10', done:false, day:4 }
  ];
}

function save() { localStorage.setItem('wl-tasks', JSON.stringify(tasks)); }

// Dark mode
function toggleDark() {
  dark = !dark;
  document.body.classList.toggle('light', !dark);
  localStorage.setItem('wl-dark', String(dark));
  updateToggle();
  renderAll();
}
function updateToggle() {
  var k = document.getElementById('knob');
  if (k) { k.textContent = dark ? '☀' : '☾'; }
}

// Notification
function updateNotifUI() {
  var banner = document.getElementById('notif-banner');
  var btn = document.getElementById('btn-notif');
  if (notifStatus === 'granted') {
    if (banner) banner.classList.add('hidden');
    if (btn) btn.textContent = '🔔';
  } else if (notifStatus === 'unsupported' || notifStatus === 'dismissed') {
    if (banner) banner.classList.add('hidden');
  } else {
    if (banner) banner.classList.remove('hidden');
    if (btn) btn.textContent = '🔕';
  }
}
function handleNotif() {
  if (!('Notification' in window)) return;
  Notification.requestPermission().then(function(r) {
    notifStatus = r;
    updateNotifUI();
    if (r === 'granted') {
      sendNotif('Thong bao da bat!', 'Ban se nhan canh bao deadline & workload tu gio.');
      checkNotifs();
    }
  });
}
function dismissNotif() {
  localStorage.setItem('wl-notif-dismissed', '1');
  notifStatus = 'dismissed';
  updateNotifUI();
}
function sendNotif(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(title, { body: body, icon: '/icon-192.png' }); } catch(e) {}
}
function checkNotifs() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  var today = new Date(); today.setHours(0,0,0,0);
  var used = tasks.filter(function(t){ return !t.done; }).reduce(function(s,t){ return s+t.hours; }, 0);
  var pct = (used/CAPACITY)*100;
  var todayStr = new Date().toDateString();

  tasks.filter(function(t){ return !t.done && t.deadline; }).forEach(function(t) {
    var dl = new Date(t.deadline);
    var diff = Math.round((dl-today)/86400000);
    var key = 'wl-n-'+t.id+'-'+diff;
    if (localStorage.getItem(key)) return;
    if (diff < 0)    { sendNotif('Task qua han!', t.title+' da qua deadline '+Math.abs(diff)+' ngay.'); localStorage.setItem(key,'1'); }
    else if (diff===0){ sendNotif('Deadline hom nay!', t.title+' can hoan thanh ngay hom nay.'); localStorage.setItem(key,'1'); }
    else if (diff===1){ sendNotif('Deadline ngay mai', t.title+' con 1 ngay - dung de tre!'); localStorage.setItem(key,'1'); }
    else if (diff===3){ sendNotif('Nhac nho deadline', t.title+' con 3 ngay nua den han.'); localStorage.setItem(key,'1'); }
  });
  if (pct>=100 && localStorage.getItem('wl-cap-100')!==todayStr) {
    sendNotif('Workload tran!', 'Da vuot '+used+'h/'+CAPACITY+'h. Dung nhan them task moi.');
    localStorage.setItem('wl-cap-100', todayStr);
  } else if (pct>=80 && pct<100 && localStorage.getItem('wl-cap-80')!==todayStr) {
    sendNotif('Workload gan day', 'Da dung '+used+'h/'+CAPACITY+'h. Can nhac truoc khi nhan them.');
    localStorage.setItem('wl-cap-80', todayStr);
  }
}

// Capacity bar
function renderCap() {
  var used = tasks.filter(function(t){ return !t.done; }).reduce(function(s,t){ return s+t.hours; }, 0);
  var pct  = Math.min((used/CAPACITY)*100, 100);
  var col  = pct>85 ? '#E53935' : pct>60 ? '#F57C00' : '#2E7D32';
  var free = CAPACITY-used;
  document.getElementById('cap-used').textContent  = used+'h';
  document.getElementById('cap-avail-label').textContent = free>0 ? 'AVAILABLE' : 'OVERLOADED';
  document.getElementById('cap-avail').textContent = free>0 ? '+'+free+'h' : Math.abs(free)+'h over';
  document.getElementById('cap-avail').style.color = col;
  document.getElementById('cap-fill').style.width  = pct+'%';
  document.getElementById('cap-fill').style.background = col;
  document.getElementById('cap-msg').style.color   = col;
  document.getElementById('cap-msg').textContent   = pct<60 ? '✓ Ban co the nhan them task' : pct<85 ? '⚡ Dang ban — can nhac ky truoc khi nhan' : '🔴 Da day — hoan thanh truoc khi nhan them';
}

// Form
function toggleForm() {
  showForm = !showForm;
  document.getElementById('add-form').className = showForm ? 'show' : '';
  document.getElementById('btn-add').textContent = showForm ? '✕' : '+ Add';
  document.getElementById('btn-add').className = showForm ? 'btn btn-primary' : 'btn';
}
function addTask() {
  var title = document.getElementById('f-title').value.trim();
  var hours = parseFloat(document.getElementById('f-hours').value);
  if (!title || !hours) return;
  pushHistory();
  tasks.push({
    id: Date.now(),
    title: title,
    priority: document.getElementById('f-priority').value,
    hours: hours,
    category: document.getElementById('f-category').value,
    deadline: document.getElementById('f-deadline').value,
    day: parseInt(document.getElementById('f-day').value),
    done: false
  });
  save();
  document.getElementById('f-title').value = '';
  document.getElementById('f-hours').value = '';
  document.getElementById('f-deadline').value = '';
  document.getElementById('f-priority').value = 'med';
  toggleForm();
  checkNotifs();
  renderAll();
}

// Tab switching
function switchTab(tab) {
  currentTab = tab;
  ['week','list','ai'].forEach(function(t) {
    document.getElementById('tab-'+t).className = 'tab-btn' + (t===tab?' active':'');
    document.getElementById('content-'+t).className = 'tab-content' + (t===tab?' active':'');
  });
  if (tab === 'ai') runAI();
}

// Deadline label
function dlLabel(task) {
  if (!task.deadline || task.done) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  var diff = Math.round((new Date(task.deadline)-today)/86400000);
  if (diff < 0)   return { text:'Qua han '+Math.abs(diff)+'ng', color:'#E53935' };
  if (diff === 0) return { text:'Hom nay!',  color:'#E53935' };
  if (diff === 1) return { text:'Ngay mai',  color:'#F57C00' };
  if (diff <= 3)  return { text:'Con '+diff+' ngay', color:'#F57C00' };
  return { text:'📅 '+task.deadline, color: dark ? '#444' : '#AAA' };
}

// Build task HTML
function taskHTML(task) {
  var pc = PC[task.priority];
  var dl = dlLabel(task);
  var isOver = dl && dl.color === '#E53935';
  var dlHTML = dl ? '<span class="dl-tag" style="color:'+dl.color+'">'+dl.text+'</span>' : '';
  return '<div class="task-row'+(task.done?' done':'')+(isOver?' overdue':'')+'" id="tr-'+task.id+'">' +
    '<div class="check'+(task.done?' checked':'')+'" style="--pc:'+pc.color+'" onclick="toggleDone('+task.id+')"></div>' +
    '<div class="task-body">' +
      '<div class="task-title">'+escHtml(task.title)+'</div>' +
      '<div class="task-meta">' +
        '<span class="badge" style="color:'+pc.color+';background:'+pc.bg+';border:1px solid '+pc.color+'25">'+pc.label+'</span>' +
        '<span class="meta-tag">'+escHtml(task.category)+'</span>' +
        '<span class="meta-dim">⏱ '+task.hours+'h</span>' +
        '<span class="meta-dim">'+DAYS[task.day]+'</span>' +
        dlHTML +
      '</div>' +
    '</div>' +
    '<button class="task-del" onclick="deleteTask('+task.id+')">✕</button>' +
  '</div>';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleDone(id) {
  pushHistory();
  tasks = tasks.map(function(t){ return t.id===id ? Object.assign({},t,{done:!t.done}) : t; });
  save(); renderAll();
}
function deleteTask(id) {
  pushHistory();
  tasks = tasks.filter(function(t){ return t.id!==id; });
  save(); renderAll();
}

// Render week view
function renderWeek() {
  var dayHours = DAYS.map(function(_,i){
    return tasks.filter(function(t){ return t.day===i&&!t.done; }).reduce(function(s,t){ return s+t.hours; },0);
  });

  var dayRowHTML = '';
  DAYS.forEach(function(d,i) {
    var h = dayHours[i];
    var active = i===filterDay;
    var isToday = i===TODAY_IDX;
    var cls = 'day-btn'+(active?' active':'')+(isToday&&!active?' today':'');
    var nameColor = active ? (dark?'#0E0E0E':'#fff') : isToday ? '#888' : (dark?'#444':'#AAA');
    var hoursColor = active ? (dark?'#0E0E0E':'#fff') : h>8 ? '#E53935' : (dark?'#F0F0F0':'#111');
    dayRowHTML += '<button class="'+cls+'" onclick="selectDay('+i+')">' +
      '<span class="day-name" style="color:'+nameColor+'">'+d+'</span>' +
      '<span class="day-hours" style="color:'+hoursColor+'">'+h+'h</span>' +
      (isToday&&!active ? '<div class="day-dot"></div>' : '') +
    '</button>';
  });
  document.getElementById('day-row').innerHTML = dayRowHTML;

  var dayTasks = tasks.filter(function(t){ return t.day===filterDay; }).sort(sortFn);
  document.getElementById('day-info').textContent =
    FULL_DAYS[filterDay].toUpperCase()+' — '+dayTasks.filter(function(t){ return !t.done; }).length+' tasks · '+dayHours[filterDay]+'h';

  var html = dayTasks.length===0 ? '<div class="task-empty">Chua co task nao</div>' : dayTasks.map(taskHTML).join('');
  document.getElementById('week-tasks').innerHTML = html;
}

function selectDay(i) { filterDay=i; renderWeek(); }

// Render list view
function renderList() {
  var doneCount = tasks.filter(function(t){ return t.done; }).length;
  var wrap = document.getElementById('clear-done-wrap');
  if (wrap) {
    wrap.innerHTML = doneCount > 0
      ? '<button class="btn-clear-done" onclick="clearDone()">🗑 Xóa ' + doneCount + ' task đã done</button>'
      : '';
  }
  var filters = [
    {key:'all', label:'ALL'},
    {key:'high', label:'HIGH'},
    {key:'med',  label:'MED'},
    {key:'low',  label:'LOW'}
  ];
  var filterHTML = filters.map(function(f) {
    var count = f.key==='all' ? tasks.filter(function(t){return !t.done;}).length : tasks.filter(function(t){return t.priority===f.key&&!t.done;}).length;
    var cls = 'filter-btn'+(filterPri===f.key ? (f.key==='all'?' active-all':' active-'+f.key) : '');
    return '<button class="'+cls+'" onclick="setFilter(\''+f.key+'\')">'+f.label+' <span style="opacity:0.5">'+count+'</span></button>';
  }).join('');
  document.getElementById('filter-row').innerHTML = filterHTML;

  var sorted = tasks.slice().filter(function(t){ return filterPri==='all'||t.priority===filterPri; }).sort(sortFn);
  document.getElementById('list-tasks').innerHTML = sorted.length===0 ? '<div class="task-empty">Khong co task</div>' : sorted.map(taskHTML).join('');
}

function setFilter(p) { filterPri=p; renderList(); }

function sortFn(a,b) {
  var ord={high:0,med:1,low:2};
  if (a.done!==b.done) return a.done?1:-1;
  return ord[a.priority]-ord[b.priority];
}

// Render all
function renderAll() {
  renderCap();
  renderWeek();
  renderList();
}

// Export CSV
function exportCSV() {
  var rows = [['Title','Priority','Hours','Category','Deadline','Day','Done']];
  tasks.forEach(function(t){ rows.push(['"'+t.title+'"',t.priority,t.hours,t.category,t.deadline||'',FULL_DAYS[t.day]||'',t.done?'Yes':'No']); });
  var blob = new Blob([rows.map(function(r){return r.join(',');}).join('\n')],{type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'workload.csv';
  a.click();
}

// AI
function saveApiKey() {
  var input = document.getElementById('api-key-input');
  if (!input || !input.value.trim()) return;
  localStorage.setItem('wl-apikey', input.value.trim());
  runAI();
}

function runAI() {
  var el = document.getElementById('ai-content');
  var apiKey = localStorage.getItem('wl-apikey') || '';

  if (!apiKey) {
    var bg = dark ? '#161616' : '#fff';
    var border = dark ? '#272727' : '#DDD';
    var textColor = dark ? '#888' : '#666';
    var inputBg = dark ? '#1A1A1A' : '#F0EFE9';
    var inputColor = dark ? '#F0F0F0' : '#111';
    el.innerHTML =
      '<div class="ai-card">' +
        '<div class="ai-top-label">✦ CÀI ĐẶT AI</div>' +
        '<div style="font-size:13px;color:'+textColor+';line-height:1.6;margin-bottom:14px">' +
          'Cần Anthropic API key để dùng tính năng này.<br><br>' +
          '1. Vào <a href="https://console.anthropic.com" target="_blank" style="color:#F57C00">console.anthropic.com</a><br>' +
          '2. Đăng ký miễn phí → vào API Keys<br>' +
          '3. Tạo key mới → paste vào đây' +
        '</div>' +
        '<input id="api-key-input" type="password" placeholder="sk-ant-api03-..." style="width:100%;background:'+inputBg+';border:1px solid '+border+';border-radius:6px;padding:10px 12px;color:'+inputColor+';font-size:13px;font-family:inherit;outline:none;margin-bottom:10px" />' +
        '<button onclick="saveApiKey()" style="width:100%;background:#F57C00;color:#fff;border:none;border-radius:6px;padding:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">Lưu & Phân tích</button>' +
        '<div style="font-size:10px;color:'+textColor+';margin-top:10px;line-height:1.5">🔒 Key được lưu trên thiết bị của bạn, không gửi đi đâu khác.</div>' +
      '</div>';
    return;
  }

  el.innerHTML = '<div class="ai-loading"><div class="star">✦</div><div class="msg">DANG PHAN TICH TASK...</div></div>';
  var active = tasks.filter(function(t){ return !t.done; });
  var used   = active.reduce(function(s,t){ return s+t.hours; },0);
  var prompt = 'Ban la productivity coach. Phan tich cac task sau va dua ra thu tu uu tien.\n'+
    'Tasks: '+JSON.stringify(active.map(function(t){ return {title:t.title,priority:t.priority,hours:t.hours,category:t.category,deadline:t.deadline||'khong co deadline',day:FULL_DAYS[t.day]}; }))+'\n'+
    'Capacity: '+used+'/'+CAPACITY+'h da dung. Hom nay: '+FULL_DAYS[TODAY_IDX]+'.\n'+
    'Tra loi HOAN TOAN bang tieng Viet, CHI JSON (khong markdown):\n'+
    '{"topTask":"ten task","topReason":"ly do ngan gon","orderedList":[{"rank":1,"title":"...","reason":"ly do cu the tai sao lam truoc","urgency":"high|med|low"}],"capacityAdvice":"nhan xet workload","focusTip":"tip cho hom nay"}';

  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    var text = data.content.map(function(b){ return b.text||''; }).join('');
    var ai = JSON.parse(text.replace(/```json|```/g,'').trim());
    var html = '<div class="ai-card">' +
      '<div class="ai-top-label">✦ LAM TRUOC TIEN</div>' +
      '<div class="ai-top-title">'+escHtml(ai.topTask)+'</div>' +
      '<div class="ai-top-reason">'+escHtml(ai.topReason)+'</div></div>';
    html += '<div class="ai-section-label" style="color:'+(dark?'#444':'#AAA')+'">THU TU UU TIEN</div>';
    ai.orderedList.forEach(function(item){
      var col = item.urgency==='high'?'#E53935':item.urgency==='med'?'#F57C00':'#2E7D32';
      html += '<div class="ai-item"><div class="ai-item-rank">'+item.rank+'</div><div style="flex:1"><div class="ai-item-title">'+escHtml(item.title)+'</div><div class="ai-item-reason">'+escHtml(item.reason)+'</div></div><div class="ai-item-urgency" style="color:'+col+'">'+item.urgency.toUpperCase()+'</div></div>';
    });
    [{label:'CAPACITY',value:ai.capacityAdvice,color:'#2E7D32'},{label:'TIP HOM NAY',value:ai.focusTip,color:'#F57C00'}].forEach(function(a){
      html += '<div class="ai-advice"><div class="ai-advice-label" style="color:'+a.color+'">'+a.label+'</div><div class="ai-advice-text">'+escHtml(a.value)+'</div></div>';
    });
    html += '<button class="btn-ai-refresh" onclick="runAI()">↻ Phan tich lai</button>';
    el.innerHTML = html;
  })
  .catch(function(){
    el.innerHTML = '<div class="ai-error">Khong the tai goi y AI. Vui long thu lai.</div><button class="btn-ai-refresh" onclick="runAI()" style="margin-top:12px">↻ Thu lai</button>';
  });
}

// Service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}

// Check notifs on load
setTimeout(checkNotifs, 2000);
